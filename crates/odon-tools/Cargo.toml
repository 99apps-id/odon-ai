[package]
name = "odon-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Structured tool execution engine, GitHub connectors, MCP client, and artifact synthesis"

[dependencies]
odon-core = { workspace = true }
odon-security = { workspace = true }
odon-storage = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
url = { workspace = true }
sha2 = { workspace = true }
arboard = { version = "3.6", default-features = false }
# zip 2.x carried four RustSec advisories (RUSTSEC-2026-0367/0368/0369/0429),
# one of them critical, all fixed in >=9.0.0. Only the flate2 backend is
# needed, so the umbrella `deflate` feature (which also pulls zopfli) is avoided.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip's `deflate-flate2` only wires up the glue; flate2 itself needs a backend
# chosen. Pin the pure-Rust one so no C toolchain or system zlib is required.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
dirs = "6"
walkdir = "2"
tokio-tungstenite = "0.26"
