name: CI

# Every push and PR gets the checks that previously only a human could remember
# to run: formatting, lints, the test suite, and dependency advisories.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        # -D warnings is scoped to this invocation on purpose. A global RUSTFLAGS
        # would apply to dependency builds too, and one upstream warning would
        # then fail a run nobody can fix.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Kept separate so a red advisory database does not mask a red test run: the
  # two failures need very different reactions.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit frontend dependencies
        working-directory: desktop
        run: pnpm audit --audit-level high

  manifest:
    name: Manifest consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release version is duplicated across four manifests and is bumped by
      # hand. Drift here ships an installer that disagrees with its own daemon.
      - name: Version strings agree
        run: |
          set -euo pipefail
          semver() { grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1; }
          cargo_v=$(grep -m1 '^version = ' Cargo.toml | semver)
          pkg_v=$(grep -m1 '"version"' desktop/package.json | semver)
          tauri_v=$(grep -m1 '"version"' desktop/src-tauri/tauri.conf.json | semver)
          sidecar_v=$(grep -m1 '^version = ' desktop/src-tauri/Cargo.toml | semver)
          echo "Cargo.toml=$cargo_v package.json=$pkg_v tauri.conf.json=$tauri_v src-tauri/Cargo.toml=$sidecar_v"
          for v in "$pkg_v" "$tauri_v" "$sidecar_v"; do
            if [ "$v" != "$cargo_v" ]; then
              echo "::error::Version drift: expected $cargo_v, found $v"
              exit 1
            fi
          done

      - name: No stray agent scratch files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^(rt_[0-9]+|runtime_chunk_[0-9]+|temp_runtime).*\.txt$'; then
            echo "::error::Agent scratch output is tracked; it belongs in .gitignore"
            exit 1
          fi
      # README advertises a tool count that has drifted from the registry twice
      # before (195 vs 226 vs the real 227). Derive it from the golden manifest,
      # which the `cargo test` job already locks to the registry, so the number
      # a reader sees cannot disagree with the number that ships.
      - name: README tool count matches the registry
        run: |
          set -euo pipefail
          actual=$(python3 -c 'import json;print(len(json.load(open("crates/odon-tools/src/golden_manifest.json"))))')
          echo "registry tools: $actual"
          readme=$(grep -oE 'exposes [0-9]+ registered tools' README.md | grep -oE '[0-9]+' || true)
          badge=$(grep -oE 'Tools_Registry-[0-9]+_Registered' README.md | grep -oE '[0-9]+' || true)
          for pair in "prose:$readme" "badge:$badge"; do
            label=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "$actual" ]; then
              echo "::error::README $label says '$value' tools, registry has $actual"
              exit 1
            fi
          done
          echo "README agrees with the registry ($actual tools)"

      # A stale .env.example is worse than none: it advertises knobs that do
      # nothing and hides knobs that matter. Every documented key must be read
      # somewhere in the code.
      - name: Documented env vars exist in code
        run: |
          set -euo pipefail
          missing=0
          while IFS='=' read -r name _; do
            case "$name" in ''|\#*) continue ;; esac
            if ! grep -rqF "\"$name\"" crates scripts --include='*.rs' --include='*.mjs' --exclude-dir=node_modules; then
              echo "::error::$name is documented in .env.example but never read by the code"
              missing=1
            fi
          done < .env.example
          exit $missing